<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Network - Admin Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        input, textarea { border: 1px solid #1e293b !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyCRLd-2PXRjkL6f59dEplWadvsRuUBHDmY",
            authDomain: "support-network-33699.firebaseapp.com",
            projectId: "support-network-33699",
            storageBucket: "support-network-33699.firebasestorage.app",
            messagingSenderId: "541408271881",
            appId: "1:541408271881:web:588b8eb4e93b102a0de2d8"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [view, setView] = useState('home');
            const [authMode, setAuthMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(true);
            const [news, setNews] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [myChats, setMyChats] = useState([]);
            const [activeChat, setActiveChat] = useState(null);
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const [adminText, setAdminText] = useState('');
            const scrollRef = useRef(null);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        setUser(u);
                        db.collection('users').doc(u.uid).onSnapshot(snap => {
                            if (snap.exists) setProfile(snap.data());
                        });
                    } else { setUser(null); setProfile(null); }
                    setLoading(false);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return;
                return db.collection('news').orderBy('createdAt', 'desc').onSnapshot(s => 
                    setNews(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
            }, [user]);

            useEffect(() => {
                if (!user) return;
                return db.collection('chats').where('participants', 'array-contains', user.uid)
                    .onSnapshot(s => setMyChats(s.docs.map(d => ({id: d.id, ...d.data()}))));
            }, [user]);

            useEffect(() => {
                if (!activeChat) return;
                return db.collection('chats').doc(activeChat.id).collection('messages')
                    .orderBy('createdAt', 'asc').onSnapshot(s => {
                        setMessages(s.docs.map(d => ({id: d.id, ...d.data()})));
                        setTimeout(() => scrollRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                    });
            }, [activeChat]);

            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    if (authMode === 'register') {
                        const res = await auth.createUserWithEmailAndPassword(email, password);
                        const newProf = { 
                            uid: res.user.uid, 
                            email, 
                            name: email.split('@')[0], 
                            photoURL: `https://api.dicebear.com/7.x/identicon/svg?seed=${res.user.uid}`, 
                            role: 'user' 
                        };
                        await db.collection('users').doc(res.user.uid).set(newProf);
                    } else { 
                        await auth.signInWithEmailAndPassword(email, password); 
                    }
                } catch (err) { alert(err.message); }
            };

            const postNews = async () => {
                if(!adminText.trim()) return;
                await db.collection('news').add({
                    text: adminText,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setAdminText('');
            };

            const startChat = async (target) => {
                const id = [user.uid, target.uid].sort().join('_');
                await db.collection('chats').doc(id).set({
                    id, participants: [user.uid, target.uid],
                    participantDetails: { 
                        [user.uid]: { name: profile.name, photo: profile.photoURL },
                        [target.uid]: { name: target.name, photo: target.photoURL }
                    },
                    lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                setActiveChat({ id, ...target });
                setView('messages');
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-blue-500 font-bold">ЗАГРУЗКА...</div>;

            if (!user) return (
                <div className="h-screen flex items-center justify-center p-4">
                    <div className="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl">
                        <h2 className="text-2xl font-bold text-center mb-8">{authMode === 'login' ? 'Вход' : 'Регистрация'}</h2>
                        <form onSubmit={handleAuth} className="space-y-4 text-slate-900">
                            <input type="email" placeholder="Email" className="w-full bg-slate-100 p-3 rounded-xl outline-none" value={email} onChange={e => setEmail(e.target.value)} required />
                            <input type="password" placeholder="Пароль" className="w-full bg-slate-100 p-3 rounded-xl outline-none" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all">{authMode === 'login' ? 'Войти' : 'Создать аккаунт'}</button>
                        </form>
                        <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="w-full mt-6 text-sm text-slate-400">
                            {authMode === 'login' ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти'}
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Боковая панель */}
                    <nav className="w-20 md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col p-4 shrink-0">
                        <div className="text-blue-500 font-black text-xl mb-10 text-center md:text-left">HELP NET</div>
                        <div className="flex-1 space-y-2">
                            <button onClick={() => setView('home')} className={`w-full flex items-center p-3 rounded-xl gap-3 transition-colors ${view === 'home' ? 'bg-blue-600' : 'hover:bg-slate-800 text-slate-400'}`}>
                                🏠 <span className="hidden md:block">Главная</span>
                            </button>
                            <button onClick={() => setView('search')} className={`w-full flex items-center p-3 rounded-xl gap-3 transition-colors ${view === 'search' ? 'bg-blue-600' : 'hover:bg-slate-800 text-slate-400'}`}>
                                🔍 <span className="hidden md:block">Поиск друзей</span>
                            </button>
                            <button onClick={() => setView('messages')} className={`w-full flex items-center p-3 rounded-xl gap-3 transition-colors ${view === 'messages' ? 'bg-blue-600' : 'hover:bg-slate-800 text-slate-400'}`}>
                                💬 <span className="hidden md:block">Мои чаты</span>
                            </button>
                        </div>
                        <button onClick={() => auth.signOut()} className="p-3 text-red-400 flex items-center gap-3 hover:bg-red-950/20 rounded-xl">
                            🚪 <span className="hidden md:block">Выйти</span>
                        </button>
                    </nav>

                    <main className="flex-1 overflow-y-auto bg-slate-950 p-4 md:p-10 custom-scroll">
                        {view === 'home' && (
                            <div className="max-w-2xl mx-auto space-y-6 pb-20">
                                <div className="bg-gradient-to-br from-blue-600 to-indigo-800 p-8 rounded-3xl shadow-xl">
                                    <h1 className="text-2xl font-bold">Привет, {profile?.name || 'Пользователь'}! 👋</h1>
                                    <p className="opacity-70 mt-1">Рады видеть тебя в нашей сети взаимопомощи.</p>
                                </div>

                                {profile?.role === 'admin' && (
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-blue-500/30 shadow-lg">
                                        <h3 className="text-blue-400 font-bold mb-3 flex items-center gap-2">🛡️ ПАНЕЛЬ АДМИНА</h3>
                                        <textarea 
                                            className="w-full bg-slate-800 p-3 rounded-xl outline-none focus:ring-1 focus:ring-blue-500 mb-3 text-sm min-h-[100px]"
                                            placeholder="Напишите новость для всех пользователей..."
                                            value={adminText}
                                            onChange={e => setAdminText(e.target.value)}
                                        />
                                        <button onClick={postNews} className="bg-blue-600 px-8 py-2.5 rounded-xl font-bold hover:bg-blue-700 transition-all text-sm">Опубликовать</button>
                                    </div>
                                )}

                                <div className="space-y-4">
                                    <h2 className="font-bold text-slate-500 text-xs tracking-[0.2em] uppercase">Последние новости</h2>
                                    {news.length === 0 && <p className="text-slate-700 py-10 text-center italic">Пока новостей нет...</p>}
                                    {news.map(n => (
                                        <div key={n.id} className="bg-slate-900/50 p-6 rounded-2xl border border-slate-800 group relative">
                                            <p className="text-slate-300 leading-relaxed">{n.text}</p>
                                            {profile?.role === 'admin' && (
                                                <button onClick={() => db.collection('news').doc(n.id).delete()} className="absolute top-4 right-4 text-red-900 opacity-0 group-hover:opacity-100 transition-all hover:text-red-500 text-xs uppercase font-bold">Удалить</button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'search' && (
                            <div className="max-w-2xl mx-auto">
                                <h2 className="text-xl font-bold mb-6">Найти друга</h2>
                                <div className="flex gap-2 mb-8">
                                    <input className="flex-1 bg-slate-900 p-4 rounded-2xl border border-slate-800 outline-none focus:border-blue-500" placeholder="Введите имя..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                                    <button onClick={async () => {
                                        const s = await db.collection('users').where('name', '>=', searchQuery).get();
                                        setSearchResults(s.docs.map(d => d.data()).filter(u => u.uid !== user.uid));
                                    }} className="bg-blue-600 px-8 rounded-2xl font-bold">🔍</button>
                                </div>
                                <div className="grid grid-cols-1 gap-3">
                                    {searchResults.map(u => (
                                        <div key={u.uid} className="bg-slate-900 p-4 rounded-2xl flex justify-between items-center border border-slate-800 hover:border-slate-600 transition-all">
                                            <div className="flex items-center gap-4">
                                                <img src={u.photoURL} className="w-12 h-12 rounded-full border border-slate-700" />
                                                <span className="font-bold">{u.name}</span>
                                            </div>
                                            <button onClick={() => startChat(u)} className="bg-slate-800 px-4 py-2 rounded-xl text-blue-400 hover:bg-blue-600 hover:text-white transition-all text-sm font-bold">Написать</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'messages' && (
                            <div className="flex h-[80vh] gap-4 overflow-hidden">
                                <div className="w-full md:w-72 space-y-2 overflow-y-auto custom-scroll pr-2">
                                    <h2 className="text-xs font-bold text-slate-500 mb-4 tracking-widest uppercase">Ваши диалоги</h2>
                                    {myChats.map(c => {
                                        const otherId = c.participants.find(id => id !== user.uid);
                                        const other = c.participantDetails[otherId];
                                        return (
                                            <div key={c.id} onClick={() => setActiveChat({id: c.id, ...other})} className={`p-4 rounded-2xl cursor-pointer transition-all border ${activeChat?.id === c.id ? 'bg-blue-600 border-blue-400' : 'bg-slate-900 border-slate-800 hover:bg-slate-800'}`}>
                                                <div className="flex items-center gap-3">
                                                    <img src={other.photo} className="w-8 h-8 rounded-full" />
                                                    <p className="font-bold text-sm truncate">{other.name}</p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="hidden md:flex flex-1 flex-col bg-slate-900 rounded-[2rem] border border-slate-800 overflow-hidden shadow-2xl">
                                    {activeChat ? (
                                        <>
                                            <div className="p-6 border-b border-slate-800 flex items-center gap-3 bg-slate-900/50">
                                                <img src={activeChat.photo} className="w-8 h-8 rounded-full" />
                                                <span className="font-bold">{activeChat.name}</span>
                                            </div>
                                            <div className="flex-1 overflow-y-auto p-6 space-y-4 custom-scroll bg-slate-950/30">
                                                {messages.map((m, i) => (
                                                    <div key={i} className={`flex ${m.senderId === user.uid ? 'justify-end' : 'justify-start'}`}>
                                                        <div className={`p-4 rounded-2xl max-w-[70%] text-sm leading-relaxed shadow-sm ${m.senderId === user.uid ? 'bg-blue-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none'}`}>
                                                            {m.text}
                                                        </div>
                                                    </div>
                                                ))}
                                                <div ref={scrollRef} />
                                            </div>
                                            <form onSubmit={async (e) => {
                                                e.preventDefault();
                                                if (!newMessage.trim()) return;
                                                const msg = newMessage;
                                                setNewMessage('');
                                                await db.collection('chats').doc(activeChat.id).collection('messages').add({
                                                    text: msg, senderId: user.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                                });
                                            }} className="p-4 bg-slate-900 flex gap-2">
                                                <input className="flex-1 bg-slate-800 p-3 rounded-2xl outline-none focus:ring-1 focus:ring-blue-500 text-sm" value={newMessage} onChange={e => setNewMessage(e.target.value)} placeholder="Введите сообщение..." />
                                                <button className="bg-blue-600 px-6 rounded-2xl font-bold hover:bg-blue-700 transition-all">➔</button>
                                            </form>
                                        </>
                                    ) : (
                                        <div className="m-auto text-center space-y-4 opacity-20">
                                            <div className="text-6xl">💬</div>
                                            <p className="font-bold">Выберите чат для общения</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
