<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Net - Full</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        /* ==========================================
           БЛОК 1: СТИЛИ (CSS)
           ========================================== */
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .nav-btn { display: flex; align-items: center; width: 100%; padding: 0.75rem; border-radius: 0.75rem; gap: 0.75rem; transition: 0.2s; color: #94a3b8; border: none; cursor: pointer; background: transparent; }
        .nav-btn.active { background-color: #2563eb; color: white; }
        .nav-btn:hover:not(.active) { background-color: #1e293b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /* ==========================================
           БЛОК 2: КОНФИГУРАЦИЯ FIREBASE
           ========================================== */
        const firebaseConfig = {
            apiKey: "AIzaSyCRLd-2PXRjkL6f59dEplWadvsRuUBHDmY",
            authDomain: "support-network-33699.firebaseapp.com",
            projectId: "support-network-33699",
            storageBucket: "support-network-33699.firebasestorage.app",
            messagingSenderId: "541408271881",
            appId: "1:541408271881:web:588b8eb4e93b102a0de2d8"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const { useState, useEffect, useRef } = React;

        /* ==========================================
           БЛОК 3: ЛОГИКА ПРИЛОЖЕНИЯ (APP)
           ========================================== */
        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [view, setView] = useState('home');
            const [loading, setLoading] = useState(true);
            const [news, setNews] = useState([]);
            const [items, setItems] = useState([]);
            const [adminText, setAdminText] = useState('');
            const [newItem, setNewItem] = useState({ title: '', price: '', img: '' });

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        setUser(u);
                        db.collection('users').doc(u.uid).onSnapshot(snap => setProfile(snap.data()));
                    } else { setUser(null); }
                    setLoading(false);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubNews = db.collection('news').orderBy('createdAt', 'desc').onSnapshot(s => 
                    setNews(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                const unsubItems = db.collection('items').onSnapshot(s => 
                    setItems(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                return () => { unsubNews(); unsubItems(); };
            }, [user]);

            const toggleLike = async (id) => {
                const ref = db.collection('news').doc(id);
                const doc = await ref.get();
                const likes = doc.data().likes || [];
                likes.includes(user.uid) ? 
                    ref.update({ likes: firebase.firestore.FieldValue.arrayRemove(user.uid) }) :
                    ref.update({ likes: firebase.firestore.FieldValue.arrayUnion(user.uid) });
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-bold text-blue-500">ЗАГРУЗКА...</div>;
            
            // Если не залогинен — простая форма (для примера)
            if (!user) return (
                <div className="h-screen flex items-center justify-center">
                    <button onClick={() => auth.signInWithEmailAndPassword('linariska0@gmail.com', '12345678')} className="bg-blue-600 p-4 rounded-xl">Войти (Тест)</button>
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Навигация */}
                    <nav className="w-64 bg-slate-900 p-6 border-r border-slate-800 flex flex-col">
                        <div className="text-blue-500 font-black text-2xl mb-10 italic">SUPPORT.NET</div>
                        <div className="space-y-2">
                            <button onClick={() => setView('home')} className={`nav-btn ${view==='home'?'active':''}`}>🏠 Главная</button>
                            <button onClick={() => setView('shop')} className={`nav-btn ${view==='shop'?'active':''}`}>🛍️ Магазин</button>
                            <button onClick={() => setView('settings')} className={`nav-btn ${view==='settings'?'active':''}`}>⚙️ Профиль</button>
                        </div>
                        <button onClick={() => auth.signOut()} className="nav-btn text-red-500 mt-auto">🚪 Выход</button>
                    </nav>

                    {/* Контент */}
                    <main className="flex-1 overflow-y-auto p-10 bg-slate-950 custom-scroll">
                        
                        {/* ПОДБЛОК: ГЛАВНАЯ */}
                        {view === 'home' && (
                            <div className="max-w-2xl mx-auto space-y-6">
                                <h1 className="text-3xl font-bold">Привет, {profile?.name}!</h1>
                                {profile?.role === 'admin' && (
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-blue-500/30">
                                        <textarea className="w-full bg-slate-800 p-4 rounded-xl outline-none mb-4" placeholder="Текст новости..." value={adminText} onChange={e => setAdminText(e.target.value)} />
                                        <button onClick={() => {
                                            db.collection('news').add({ text: adminText, likes: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                                            setAdminText('');
                                        }} className="bg-blue-600 px-6 py-2 rounded-lg font-bold">Опубликовать</button>
                                    </div>
                                )}
                                {news.map(n => (
                                    <div key={n.id} className="bg-slate-900/50 p-6 rounded-2xl border border-slate-800">
                                        <p>{n.text}</p>
                                        <button onClick={() => toggleLike(n.id)} className="mt-4 text-sm text-slate-400 hover:text-red-500">❤️ {n.likes?.length || 0}</button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* ПОДБЛОК: МАГАЗИН */}
                        {view === 'shop' && (
                            <div className="max-w-4xl mx-auto">
                                <h2 className="text-3xl font-bold mb-8">Магазин</h2>
                                {profile?.role === 'admin' && (
                                    <div className="grid grid-cols-3 gap-4 mb-10 bg-slate-900 p-6 rounded-2xl">
                                        <input className="bg-slate-800 p-3 rounded-lg" placeholder="Название" value={newItem.title} onChange={e => setNewItem({...newItem, title: e.target.value})} />
                                        <input className="bg-slate-800 p-3 rounded-lg" placeholder="Цена" value={newItem.price} onChange={e => setNewItem({...newItem, price: e.target.value})} />
                                        <input className="bg-slate-800 p-3 rounded-lg" placeholder="URL фото" value={newItem.img} onChange={e => setNewItem({...newItem, img: e.target.value})} />
                                        <button onClick={() => {
                                            db.collection('items').add(newItem);
                                            setNewItem({title:'', price:'', img:''});
                                        }} className="col-span-3 bg-blue-600 py-3 rounded-xl font-bold">Добавить товар</button>
                                    </div>
                                )}
                                <div className="grid grid-cols-3 gap-6">
                                    {items.map(i => (
                                        <div key={i.id} className="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800">
                                            <div className="h-40 bg-slate-800">
                                                {i.img && <img src={i.img} className="w-full h-full object-cover" />}
                                            </div>
                                            <div className="p-4">
                                                <h4 className="font-bold">{i.title}</h4>
                                                <div className="flex justify-between items-center mt-4">
                                                    <span className="text-blue-400 font-bold">{i.price} ₽</span>
                                                    <button className="bg-slate-800 px-4 py-1 rounded-lg text-xs">Купить</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ПОДБЛОК: НАСТРОЙКИ */}
                        {view === 'settings' && (
                            <div className="max-w-md mx-auto bg-slate-900 p-8 rounded-2xl border border-slate-800">
                                <h2 className="text-xl font-bold mb-6">Профиль</h2>
                                <label className="text-xs text-slate-500 uppercase font-bold">Имя пользователя</label>
                                <input 
                                    className="w-full bg-slate-800 p-3 rounded-xl mt-2 outline-none focus:ring-1 focus:ring-blue-500"
                                    value={profile?.name || ''}
                                    onChange={(e) => db.collection('users').doc(user.uid).update({ name: e.target.value })}
                                />
                                <div className="mt-6 p-4 bg-blue-500/10 rounded-xl text-blue-400 text-sm">
                                    Роль: <b>{profile?.role}</b>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
